<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>VocabMaster TOEIC • Flashcards EN → FR</title>
  <style>
    /* ==========================================================================
       DESIGN SYSTEM & THÈMES (CLAIR / SOMBRE MOBILE-FIRST)
       ========================================================================== */
    :root {
      --bg-app: #f1f5f9;
      --bg-card: #ffffff;
      --bg-sub: #e2e8f0;
      --bg-option: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-soft: #64748b;
      --border: #cbd5e1;

      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-soft: rgba(79, 70, 229, 0.12);

      --hl-bg: #fef08a;
      --hl-text: #854d0e;
      --hl-border: #eab308;

      --ok: #16a34a;
      --ok-bg: #dcfce7;
      --ok-border: #4ade80;
      --ok-text: #14532d;

      --err: #dc2626;
      --err-bg: #fee2e2;
      --err-border: #f87171;
      --err-text: #7f1d1d;

      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 4px 10px -6px rgba(15, 23, 42, 0.05);
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    body.dark {
      --bg-app: #090e1a;
      --bg-card: #131c31;
      --bg-sub: #1e293b;
      --bg-option: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --text-soft: #94a3b8;
      --border: #283548;

      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-soft: rgba(99, 102, 241, 0.2);

      --hl-bg: rgba(250, 204, 21, 0.22);
      --hl-text: #fde047;
      --hl-border: rgba(250, 204, 21, 0.55);

      --ok: #22c55e;
      --ok-bg: rgba(34, 197, 94, 0.18);
      --ok-border: rgba(34, 197, 94, 0.5);
      --ok-text: #bbf7d0;

      --err: #ef4444;
      --err-bg: rgba(239, 68, 68, 0.18);
      --err-border: rgba(239, 68, 68, 0.5);
      --err-text: #fecaca;

      --shadow: 0 14px 32px -6px rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.45;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px 14px 24px;
      gap: 12px;
    }

    /* ==========================================================================
       TOP BAR & STATISTIQUES GLOBALES
       ========================================================================== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .logo-pill {
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      height: 36px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    select.session-select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      height: 36px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }

    /* Bandeau d'avancement global & progression session */
    .stats-strip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .badge-score {
      color: var(--ok);
      background: var(--ok-bg);
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--ok-border);
    }

    .badge-seen {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.76rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-sub);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #06b6d4);
      border-radius: 999px;
      transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ==========================================================================
       CARTE FLASHCARD PRINCIPALE
       ========================================================================== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 18px 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      animation: fadeSlide 0.25s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .letter-tag {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .audio-group {
      display: flex;
      gap: 6px;
    }

    .audio-btn {
      background: var(--bg-option);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .audio-btn:active {
      transform: scale(0.94);
      background: var(--primary-soft);
    }

    .target-word-box {
      text-align: center;
      padding: 4px 0;
    }

    .target-word {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text-main);
      word-break: break-word;
    }

    .sentence-box {
      background: var(--bg-option);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 0.98rem;
      color: var(--text-main);
      line-height: 1.55;
    }

    .sentence-label {
      display: block;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-soft);
      margin-bottom: 4px;
    }

    .hl-word {
      background: var(--hl-bg);
      color: var(--hl-text);
      border-bottom: 2px solid var(--hl-border);
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 6px;
    }

    /* ==========================================================================
       CHOIX QCM (4 BOUTONS TACTILES)
       ========================================================================== */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: var(--bg-option);
      border: 2px solid var(--border);
      color: var(--text-main);
      padding: 13px 14px;
      border-radius: var(--radius-lg);
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 11px;
      transition: all 0.15s ease;
      min-height: 52px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.985);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-key {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 0.78rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .option-btn.correct {
      background: var(--ok-bg);
      border-color: var(--ok);
      color: var(--ok-text);
    }

    .option-btn.correct .option-key {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }

    .option-btn.wrong {
      background: var(--err-bg);
      border-color: var(--err);
      color: var(--err-text);
      animation: shake 0.3s ease;
    }

    .option-btn.wrong .option-key {
      background: var(--err);
      border-color: var(--err);
      color: #fff;
    }

    .option-btn.dimmed {
      opacity: 0.55;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* ==========================================================================
       ZONE DE FEEDBACK & TRADUCTION DE LA PHRASE
       ========================================================================== */
    .feedback-panel {
      display: none;
      border-radius: var(--radius-lg);
      padding: 13px 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      animation: fadeSlide 0.2s ease;
    }

    .feedback-panel.show {
      display: block;
    }

    .feedback-panel.is-ok {
      background: var(--ok-bg);
      border: 1.5px solid var(--ok-border);
      color: var(--ok-text);
    }

    .feedback-panel.is-err {
      background: var(--err-bg);
      border: 1.5px solid var(--err-border);
      color: var(--err-text);
    }

    .feedback-title {
      font-weight: 800;
      font-size: 0.96rem;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feedback-translation {
      font-weight: 500;
      opacity: 0.95;
    }

    /* ==========================================================================
       BOUTONS DE NAVIGATION BAS DE CARTE
       ========================================================================== */
    .bottom-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      border: none;
      border-radius: var(--radius-lg);
      padding: 15px 18px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .secondary-row {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-secondary:active {
      transform: scale(0.97);
    }

    /* ==========================================================================
       ÉCRAN RÉCAPITULATIF DE FIN DE SESSION
       ========================================================================== */
    .summary-screen {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .summary-screen.active {
      display: flex;
    }

    .summary-hero {
      text-align: center;
      padding: 10px 0;
    }

    .summary-emoji {
      font-size: 3rem;
      margin-bottom: 6px;
    }

    .summary-score {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--primary);
    }

    .summary-sub {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }

    .missed-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 44vh;
      overflow-y: auto;
      padding-right: 2px;
    }

    .missed-item {
      background: var(--bg-option);
      border: 1px solid var(--border);
      border-left: 4px solid var(--err);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      font-size: 0.86rem;
    }

    .missed-word {
      font-weight: 800;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .missed-fr {
      color: var(--ok);
      font-weight: 700;
    }

    .missed-sent {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 4px;
    }

    /* ==========================================================================
       BOÎTE DE DIALOGUE PERSONNALISÉE (SANS ALERT/CONFIRM NATIFS)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-title {
      font-size: 1.08rem;
      font-weight: 800;
    }

    .modal-body {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg-option);
      color: var(--text-main);
      cursor: pointer;
    }

    .modal-btn.danger {
      background: var(--err);
      border-color: var(--err);
      color: #fff;
    }

    .modal-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Confetti canvas overlay */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 500;
    }
  </style>
</head>
<body class="dark">
  <canvas id="confetti-canvas"></canvas>

  <div class="app">
    <!-- EN-TÊTE -->
    <header class="topbar">
      <div class="logo">
        <span>VocabMaster</span>
        <span class="logo-pill">TOEIC</span>
      </div>
      <div class="top-actions">
        <select id="session-size-select" class="session-select" title="Taille de la session">
          <option value="10">10 mots</option>
          <option value="15" selected>15 mots</option>
          <option value="20">20 mots</option>
          <option value="30">30 mots</option>
        </select>
        <button id="btn-theme" class="icon-btn" title="Changer de thème">☀️</button>
      </div>
    </header>

    <!-- BARRE DE PROGRESSION & COMPTEUR GLOBAL -->
    <section class="stats-strip">
      <div class="stats-row">
        <span id="progress-label">Mot 1 / 15</span>
        <span id="score-label" class="badge-score">Score : 0</span>
        <span id="seen-label" class="badge-seen">Découverts : 0 / 0</span>
      </div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </section>

    <!-- ÉCRAN DE QUIZ ACTIF -->
    <main id="quiz-screen" class="card">
      <div class="card-header">
        <span id="word-category" class="letter-tag">Lettre A</span>
        <div class="audio-group">
          <button id="btn-speak-word" class="audio-btn" type="button">🔊 Mot</button>
          <button id="btn-speak-sentence" class="audio-btn" type="button">🗣️ Phrase</button>
        </div>
      </div>

      <div class="target-word-box">
        <div id="target-word" class="target-word">loading...</div>
      </div>

      <div class="sentence-box">
        <span class="sentence-label">Contexte TOEIC</span>
        <div id="en-sentence">...</div>
      </div>

      <div id="options-container" class="options-grid"></div>

      <div id="feedback-panel" class="feedback-panel">
        <div id="feedback-title" class="feedback-title"></div>
        <div id="feedback-translation" class="feedback-translation"></div>
      </div>
    </main>

    <!-- ÉCRAN RÉCAPITULATIF FIN DE SESSION -->
    <section id="summary-screen" class="card summary-screen">
      <div class="summary-hero">
        <div id="summary-emoji" class="summary-emoji">🏆</div>
        <div id="summary-score" class="summary-score">15 / 15</div>
        <div id="summary-sub" class="summary-sub">Session terminée !</div>
      </div>
      <div id="missed-wrapper">
        <div style="font-weight:800; font-size:0.85rem; margin-bottom:8px; color:var(--text-muted);">
          Mots à revoir de cette session :
        </div>
        <div id="missed-list" class="missed-list"></div>
      </div>
      <button id="btn-new-session-end" class="btn-primary" type="button">
        🔄 Nouvelle session de 15 mots inédits
      </button>
    </section>

    <!-- CONTRÔLES DU BAS -->
    <footer class="bottom-controls" id="quiz-footer">
      <button id="btn-next" class="btn-primary" type="button" disabled>
        Mot suivant →
      </button>
      <div class="secondary-row">
        <button id="btn-reset-session" class="btn-secondary" type="button">
          🔄 Réinitialiser (15 nouveaux mots)
        </button>
        <button id="btn-reset-history" class="btn-secondary" type="button">
          🗑️ RAZ historique
        </button>
      </div>
    </footer>
  </div>

  <!-- MODALE DE CONFIRMATION PERSONNALISÉE -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal-box">
      <div id="modal-title" class="modal-title">Confirmation</div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="modal-btn" type="button">Annuler</button>
        <button id="modal-confirm" class="modal-btn primary" type="button">Confirmer</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       BASE DE DONNÉES COMPLÈTE TOEIC (820+ ENTRÉES A → Z AVEC PHRASES & TRADUCTIONS)
       Format compact : [word, fr, enSentence, frSentence]
       ========================================================================== */
    const RAW_VOCAB = [
      // === A ===
      ["ability", "capacité / compétence", "She demonstrated her ability to manage a large team.", "Elle a démontré sa capacité à gérer une grande équipe."],
      ["abroad", "à l'étranger", "Our company plans to expand its operations abroad next year.", "Notre entreprise prévoit d'étendre ses activités à l'étranger l'année prochaine."],
      ["absolutely", "absolument / tout à fait", "It is absolutely essential to check the contract before signing.", "Il est absolument essentiel de vérifier le contrat avant de signer."],
      ["accept", "accepter", "We are pleased to accept your invitation to the conference.", "Nous sommes ravis d'accepter votre invitation à la conférence."],
      ["access", "accès / accéder", "Only authorized personnel have access to the server room.", "Seul le personnel autorisé a accès à la salle des serveurs."],
      ["accessible", "accessible", "The new office building is easily accessible by subway.", "Le nouvel immeuble de bureaux est facilement accessible en métro."],
      ["accident", "accident", "Safety rules were updated after a minor accident in the warehouse.", "Les règles de sécurité ont été mises à jour après un accident mineur dans l'entrepôt."],
      ["accommodate", "héberger / s'adapter à / accueillir", "The hotel can accommodate up to three hundred conference guests.", "L'hôtel peut accueillir jusqu'à trois cents participants à la conférence."],
      ["accommodation", "hébergement / logement", "Travelers must book their accommodation at least two weeks in advance.", "Les voyageurs doivent réserver leur hébergement au moins deux semaines à l'avance."],
      ["accomplish", "accomplir / réaliser", "We accomplished all our quarterly sales goals ahead of schedule.", "Nous avons accompli tous nos objectifs de vente trimestriels en avance sur le calendrier."],
      ["accomplishment", "accomplissement / réussite", "Launching the product on time was a major accomplishment.", "Lancer le produit à temps a été un accomplissement majeur."],
      ["according", "selon / d'après", "According to the latest report, profits have risen by twelve percent.", "Selon le dernier rapport, les bénéfices ont augmenté de douze pour cent."],
      ["accordingly", "en conséquence", "The budget was reduced, so we adjusted our plans accordingly.", "Le budget a été réduit, nous avons donc ajusté nos plans en conséquence."],

    /* ==========================================================================
       GESTION DU STOCKAGE LOCAL (ANTI-RÉPÉTITION & PRÉFÉRENCES)
       ========================================================================== */
    function loadPersistedData() {
      try {
        const savedSeen = localStorage.getItem(STORAGE_KEY_SEEN);
        if (savedSeen) {
          const parsed = JSON.parse(savedSeen);
          if (Array.isArray(parsed)) {
            state.seenIds = new Set(parsed.filter(id => typeof id === "number" && id >= 0 && id < VOCAB_DB.length));
          }
        }
        const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
        if (savedTheme === "light") {
          document.body.classList.remove("dark");
          elBtnTheme.textContent = "🌙";
        } else {
          document.body.classList.add("dark");
          elBtnTheme.textContent = "☀️";
        }
        const savedSize = parseInt(localStorage.getItem(STORAGE_KEY_SIZE), 10);
        if ([10, 15, 20, 30].includes(savedSize)) {
          state.sessionSize = savedSize;
          elSessionSelect.value = String(savedSize);
        }
      } catch (e) {
        console.warn("Stockage local indisponible :", e);
      }
    }

    function saveSeenIds() {
      try {
        localStorage.setItem(STORAGE_KEY_SEEN, JSON.stringify(Array.from(state.seenIds)));
      } catch (e) {
        console.warn("Impossible de sauvegarder l'historique :", e);
      }
    }

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /**
     * Surligne le mot cible (ou sa forme conjuguée/plurielle proche) dans la phrase anglaise
     */
    function highlightTargetInSentence(sentence, targetWord) {
      const escaped = targetWord.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      // Tente d'abord une correspondance exacte insensible à la casse
      const exactRegex = new RegExp(`\\b(${escaped})\\b`, "gi");
      if (exactRegex.test(sentence)) {
        return sentence.replace(exactRegex, '<span class="hl-word">$1</span>');
      }
      // Sinon, essaie avec le radical du mot (ex: "apply" -> "applied", "company" -> "companies")
      const stem = escaped.length > 4 ? escaped.slice(0, -1) : escaped;
      const stemRegex = new RegExp(`\\b(${stem}[a-zA-Z]*)\\b`, "gi");
      if (stemRegex.test(sentence)) {
        return sentence.replace(stemRegex, '<span class="hl-word">$1</span>');
      }
      return sentence;
    }

    /* ==========================================================================
       PIOCHAGE INTELLIGENT DE SESSION (PRIORITÉ AUX MOTS JAMAIS VUS)
       ========================================================================== */
    function startNewSession() {
      const size = state.sessionSize;
      const unseen = VOCAB_DB.filter(item => !state.seenIds.has(item.id));
      const seen = VOCAB_DB.filter(item => state.seenIds.has(item.id));

      let picked = [];
      if (unseen.length >= size) {
        picked = shuffleArray(unseen).slice(0, size);
      } else {
        // Prend tous les mots inédits restants, puis complète avec des mots déjà vus mélangés
        const shuffledUnseen = shuffleArray(unseen);
        const needed = size - shuffledUnseen.length;
        const shuffledSeen = shuffleArray(seen).slice(0, needed);
        picked = shuffleArray([...shuffledUnseen, ...shuffledSeen]);
      }

      state.sessionWords = picked;
      state.currentIndex = 0;
      state.score = 0;
      state.answeredCurrent = false;
      state.missedWords = [];

      elSummaryScreen.classList.remove("active");
      elQuizScreen.style.display = "flex";
      elQuizFooter.style.display = "flex";

      renderCurrentCard();
    }

    function generateChoicesForWord(correctItem) {
      // Pioche 3 distracteurs distincts parmi les autres mots
      const others = VOCAB_DB.filter(item => item.id !== correctItem.id && item.fr !== correctItem.fr);
      const distractors = shuffleArray(others).slice(0, 3).map(item => ({
        fr: item.fr,
        isCorrect: false
      }));
      return shuffleArray([
        { fr: correctItem.fr, isCorrect: true },
        ...distractors
      ]);
    }

    /* ==========================================================================
       AFFICHAGE D'UNE CARTE FLASHCARD
       ========================================================================== */
    function renderCurrentCard() {
      const total = state.sessionWords.length;
      const current = state.sessionWords[state.currentIndex];
      state.answeredCurrent = false;

      // Enregistre ce mot comme vu dès qu'il est présenté
      state.seenIds.add(current.id);
      saveSeenIds();

      // Mise à jour en-tête et barres
      elProgressLabel.textContent = `Mot ${state.currentIndex + 1} / ${total}`;
      elScoreLabel.textContent = `Score : ${state.score}`;
      elSeenLabel.textContent = `Découverts : ${state.seenIds.size} / ${VOCAB_DB.length}`;
      const pct = ((state.currentIndex) / total) * 100;
      elProgressFill.style.width = `${pct}%`;

      // Contenu de la carte
      elWordCategory.textContent = `Lettre ${current.letter}`;
      elTargetWord.textContent = current.word;
      elEnSentence.innerHTML = highlightTargetInSentence(current.enSentence, current.word);

      // Réinitialisation feedback & bouton suivant
      elFeedbackPanel.className = "feedback-panel";
      elFeedbackPanel.style.display = "none";
      elBtnNext.disabled = true;
      elBtnNext.textContent = (state.currentIndex === total - 1)
        ? "Voir le bilan de la session 🏆"
        : "Mot suivant →";

      // Génération des 4 boutons QCM
      const choices = generateChoicesForWord(current);
      const keys = ["A", "B", "C", "D"];
      elOptionsContainer.innerHTML = "";

      choices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.innerHTML = `
          <span class="option-key">${keys[idx]}</span>
          <span>${choice.fr}</span>
        `;
        btn.addEventListener("click", () => handleAnswer(btn, choice.isCorrect, current));
        elOptionsContainer.appendChild(btn);
      });
    }

    /* ==========================================================================
       GESTION DE LA RÉPONSE UTILISATEUR
       ========================================================================== */
    function handleAnswer(clickedBtn, isCorrect, item) {
      if (state.answeredCurrent) return;
      state.answeredCurrent = true;

      const allBtns = Array.from(elOptionsContainer.querySelectorAll(".option-btn"));
      allBtns.forEach(btn => {
        btn.disabled = true;
        const labelText = btn.querySelector("span:last-child").textContent;
        if (labelText === item.fr) {
          btn.classList.add("correct");
        } else if (btn === clickedBtn && !isCorrect) {
          btn.classList.add("wrong");
        } else {
          btn.classList.add("dimmed");
        }
      });

      if (isCorrect) {
        state.score += 1;
        elScoreLabel.textContent = `Score : ${state.score}`;
        elFeedbackPanel.className = "feedback-panel show is-ok";
        elFeedbackTitle.textContent = "✅ Exact ! Bien joué.";
        elFeedbackTranslation.innerHTML = `<strong>Traduction de la phrase :</strong> « ${item.frSentence} »`;
        triggerMiniConfetti();
      } else {
        state.missedWords.push(item);
        elFeedbackPanel.className = "feedback-panel show is-err";
        elFeedbackTitle.textContent = `❌ Pas tout à fait ! Réponse : ${item.fr}`;
        elFeedbackTranslation.innerHTML = `<strong>Exemple en français :</strong> « ${item.frSentence} »`;
      }

      elFeedbackPanel.style.display = "block";
      elProgressFill.style.width = `${((state.currentIndex + 1) / state.sessionWords.length) * 100}%`;
      elBtnNext.disabled = false;
    }

    /* ==========================================================================
       FIN DE SESSION & ÉCRAN BILAN
       ========================================================================== */
    function showSessionSummary() {
      elQuizScreen.style.display = "none";
      elQuizFooter.style.display = "none";
      elSummaryScreen.classList.add("active");

      const total = state.sessionWords.length;
      const ratio = state.score / total;
      elSummaryScore.textContent = `${state.score} / ${total}`;

      if (ratio === 1) {
        elSummaryEmoji.textContent = "🏆";
        elSummarySub.textContent = "Score parfait ! Tu maîtrises toute cette série.";
        triggerMiniConfetti();
      } else if (ratio >= 0.75) {
        elSummaryEmoji.textContent = "🎉";
        elSummarySub.textContent = "Excellent travail ! Continue sur cette lancée.";
      } else if (ratio >= 0.5) {
        elSummaryEmoji.textContent = "💪";
        elSummarySub.textContent = "Bon entraînement ! Relis les mots ratés ci-dessous.";
      } else {
        elSummaryEmoji.textContent = "📚";
        elSummarySub.textContent = "C'est en pratiquant qu'on mémorise. Revois ces mots :";
      }

      elBtnNewSessionEnd.textContent = `🔄 Nouvelle session de ${state.sessionSize} mots inédits`;

      if (state.missedWords.length === 0) {
        elMissedWrapper.style.display = "none";
      } else {
        elMissedWrapper.style.display = "block";
        elMissedList.innerHTML = "";
        state.missedWords.forEach(w => {
          const div = document.createElement("div");
          div.className = "missed-item";
          div.innerHTML = `
            <div><span class="missed-word">${w.word}</span> → <span class="missed-fr">${w.fr}</span></div>
            <div class="missed-sent">${w.enSentence}<br><em>${w.frSentence}</em></div>
          `;
          elMissedList.appendChild(div);
        });
      }
    }

    /* ==========================================================================
       SYNTHÈSE VOCALE ANGLAISE (HORS LIGNE SUR MOBILE VIA WEB SPEECH API)
       ========================================================================== */
    function speakEnglish(text) {
      if (!("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 0.94;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.warn("Synthèse vocale indisponible :", e);
      }
    }

    /* ==========================================================================
       MODALE DE CONFIRMATION PERSONNALISÉE
       ========================================================================== */
    let pendingModalAction = null;

    function openConfirmModal(title, message, confirmLabel, isDanger, onConfirm) {
      elModalTitle.textContent = title;
      elModalBody.textContent = message;
      elModalConfirm.textContent = confirmLabel;
      elModalConfirm.className = isDanger ? "modal-btn danger" : "modal-btn primary";
      pendingModalAction = onConfirm;
      elModalBackdrop.classList.add("open");
    }

    function closeConfirmModal() {
      elModalBackdrop.classList.remove("open");
      pendingModalAction = null;
    }

    elModalCancel.addEventListener("click", closeConfirmModal);
    elModalBackdrop.addEventListener("click", (e) => {
      if (e.target === elModalBackdrop) closeConfirmModal();
    });
    elModalConfirm.addEventListener("click", () => {
      if (typeof pendingModalAction === "function") pendingModalAction();
      closeConfirmModal();
    });

    /* ==========================================================================
       CONFETTIS LÉGERS EN CANVAS POUR LES BONNES RÉPONSES
       ========================================================================== */
    function triggerMiniConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ["#22c55e", "#6366f1", "#eab308", "#06b6d4", "#ec4899"];
      const particles = Array.from({ length: 28 }, () => ({
        x: canvas.width / 2 + (Math.random() - 0.5) * 140,
        y: canvas.height * 0.45,
        vx: (Math.random() - 0.5) * 9,
        vy: -Math.random() * 8 - 3,
        size: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1
      }));

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35;
          p.alpha -= 0.024;
          if (p.alpha > 0) {
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
        });
        frame++;
        if (frame < 45) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(animate);
    }

    /* ==========================================================================
       ÉCOUTEURS D'ÉVÉNEMENTS
       ========================================================================== */
    elBtnNext.addEventListener("click", () => {
      if (state.currentIndex < state.sessionWords.length - 1) {
        state.currentIndex += 1;
        renderCurrentCard();
      } else {
        showSessionSummary();
      }
    });

    elBtnResetSession.addEventListener("click", () => {
      startNewSession();
    });

    elBtnNewSessionEnd.addEventListener("click", () => {
      startNewSession();
    });

    elBtnResetHistory.addEventListener("click", () => {
      openConfirmModal(
        "Remettre l'historique à zéro ?",
        `Tu as déjà découvert ${state.seenIds.size} mots sur ${VOCAB_DB.length}. Veux-tu effacer cette mémoire pour tout recommencer depuis le début ?`,
        "Oui, tout effacer",
        true,
        () => {
          state.seenIds.clear();
          saveSeenIds();
          startNewSession();
        }
      );
    });

    elSessionSelect.addEventListener("change", (e) => {
      const val = parseInt(e.target.value, 10);
      if ([10, 15, 20, 30].includes(val)) {
        state.sessionSize = val;
        try {
          localStorage.setItem(STORAGE_KEY_SIZE, String(val));
        } catch (err) {}
        elBtnResetSession.textContent = `🔄 Réinitialiser (${val} nouveaux mots)`;
        startNewSession();
      }
    });

    elBtnTheme.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark");
      elBtnTheme.textContent = isDark ? "☀️" : "🌙";
      try {
        localStorage.setItem(STORAGE_KEY_THEME, isDark ? "dark" : "light");
      } catch (e) {}
    });

    elBtnSpeakWord.addEventListener("click", () => {
      const current = state.sessionWords[state.currentIndex];
      if (current) speakEnglish(current.word);
    });

    elBtnSpeakSentence.addEventListener("click", () => {
      const current = state.sessionWords[state.currentIndex];
      if (current) speakEnglish(current.enSentence);
    });

    // Démarrage initial
    window.addEventListener("DOMContentLoaded", () => {
      loadPersistedData();
      elBtnResetSession.textContent = `🔄 Réinitialiser (${state.sessionSize} nouveaux mots)`;
      startNewSession();
    });
  </script>
